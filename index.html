<!DOCTYPE html>
<html lang="pt-PT">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Hand & Soul Artesanato — peças feitas à mão, com alma, criatividade e carinho. Descobre as nossas criações e personaliza a tua peça.">

    <title>Hand & Soul Artesanato</title>

    <style>
        :root {
            --fundo: #f4eee5;
            --fundo-claro: #fffaf5;
            --castanho: #3d3028;
            --castanho-suave: #79685c;
            --bege: #e7d7c5;
            --rosa: #d8aaa3;
            --verde: #899985;
            --branco: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: var(--fundo);
            color: var(--castanho);
            font-family: Georgia, serif;
            line-height: 1.7;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        img {
            max-width: 100%;
            display: block;
        }

        /* CABEÇALHO */

        header {
            background: var(--fundo-claro);
            padding: 22px 6%;
            text-align: center;
            border-bottom: 1px solid var(--bege);
        }

        .logo {
            font-size: clamp(30px, 5vw, 46px);
            letter-spacing: 3px;
            font-weight: normal;
        }

        .slogan {
            color: var(--castanho-suave);
            font-size: 13px;
            letter-spacing: 2px;
            margin-top: 3px;
            font-style: italic;
        }

        nav {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 28px;
            margin-top: 22px;
        }

        nav a {
            font-size: 13px;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: color 0.2s;
        }

        nav a:hover {
            color: #a77b70;
        }

        /* SECÇÃO INICIAL */

        .inicio {
            min-height: 540px;
            padding: 100px 8%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background:
                linear-gradient(
                    rgba(244, 238, 229, 0.35),
                    rgba(244, 238, 229, 0.85)
                );
        }

        .inicio-conteudo {
            max-width: 760px;
        }

        .inicio h1 {
            font-size: clamp(38px, 7vw, 66px);
            font-weight: normal;
            line-height: 1.2;
            margin-bottom: 22px;
        }

        .inicio p {
            color: var(--castanho-suave);
            font-size: 17px;
            max-width: 600px;
            margin: 0 auto 30px;
        }

        .botao {
            display: inline-block;
            padding: 13px 28px;
            background: var(--castanho);
            color: var(--branco);
            border: 1px solid var(--castanho);
            font-family: Georgia, serif;
            font-size: 12px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.25s;
        }

        .botao:hover {
            background: transparent;
            color: var(--castanho);
        }

        /* SECÇÕES GERAIS */

        section {
            padding: 85px 7%;
            scroll-margin-top: 25px;
        }

        .titulo-seccao {
            text-align: center;
            font-size: clamp(29px, 4vw, 39px);
            font-weight: normal;
            margin-bottom: 15px;
        }

        .section-intro {
            max-width: 650px;
            margin: 0 auto 45px;
            text-align: center;
            color: var(--castanho-suave);
            font-size: 16px;
        }

        /* CATEGORIAS */

        .categorias {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 22px;
            max-width: 1100px;
            margin: 0 auto;
        }

        .categoria {
            background: var(--fundo-claro);
            padding: 30px 20px;
            text-align: center;
            border: 1px solid var(--bege);
            transition: transform 0.25s;
        }

        .categoria:hover {
            transform: translateY(-4px);
        }

        .categoria span {
            display: block;
            font-size: 30px;
            margin-bottom: 10px;
        }

        .categoria strong {
            display: block;
            font-size: 18px;
            font-weight: normal;
            margin-bottom: 8px;
        }

        .categoria p {
            color: var(--castanho-suave);
            font-size: 14px;
        }

        <!-- GALERIA -->

<section class="galeria" id="galeria">

    <h2 class="titulo-seccao">
        Um pouco do nosso universo 🤎
    </h2>

    <p class="section-intro">
        Cada criação tem a sua própria história.
        Espreita algumas das nossas peças artesanais.
    </p>

    <div class="galeria-pecas">

        <img src="2122d612-e72e-43a1-8d0f-b2fef9ecb504.jpeg" alt="Criação artesanal Hand & Soul">

        <img src="26a2747b-3301-454f-8864-f6b7a20cc6d9.jpeg" alt="Criação artesanal Hand & Soul">

        <img src="3CBA9D00-7AAA-4E2F-861C-4F456A996570.png" alt="Criação artesanal Hand & Soul">

        <img src="5b12b8d8-2d43-4808-98b2-9c20477de342.jpeg" alt="Criação artesanal Hand & Soul">

        <img src="5ffdbc09-0f39-4422-b354-24b86c7c8db1.jpeg" alt="Criação artesanal Hand & Soul">

        <img src="9542B2BE-2B9D-4D62-B01D-18E901602EE3.jpeg" alt="Criação artesanal Hand & Soul">

        <img src="9be0c417-84b6-4e2d-9dd6-f6ef13073a57.jpeg" alt="Criação artesanal Hand & Soul">

        <img src="B89254F1-B67F-41D1-B3DF-4BC2AB180C79.jpeg" alt="Criação artesanal Hand & Soul">

        <img src="IMG_5962.jpeg" alt="Criação artesanal Hand & Soul">

        <img src="IMG_5991.jpeg" alt="Criação artesanal Hand & Soul">

        <img src="IMG_6342.jpeg" alt="Criação artesanal Hand & Soul">

    </div>

</section>


<!-- SOBRE NÓS -->

<section class="sobre" id="sobre">

    <div class="sobre-conteudo">

        <h2 class="titulo-seccao">
            Sobre nós 🤎
        </h2>

        <p>
            A Hand & Soul nasceu da vontade de criar
            peças únicas, feitas à mão e com significado.
        </p>

        <p>
            Acreditamos na beleza do trabalho artesanal,
            na criatividade e na liberdade de expressão.
            Cada peça é uma oportunidade de transformar
            ideias em algo especial.
        </p>

        <p>
            Valorizamos a individualidade, a criação
            consciente e o carinho colocado em cada detalhe.
        </p>

    </div>

</section>


<!-- PERSONALIZAÇÃO -->

<section class="personaliza" id="personaliza">

    <div class="personaliza-conteudo">

        <h2 class="titulo-seccao">
            Cria algo único connosco ✨
        </h2>

        <p class="section-intro">
            Tens uma ideia especial? Gostavas de combinar
            modelos, escolher cores ou criar uma peça
            totalmente tua? Conta-nos o que imaginaste!
        </p>

        <div class="caixa-ideia">

            <h3>
                A tua ideia 💭
            </h3>

            <p>
                Partilha connosco a tua inspiração
                e vamos dar-lhe vida!
            </p>

            <textarea
                id="observacoes"
                placeholder="Escreve aqui a tua ideia..."
                rows="5"
            ></textarea>

            <button
                type="button"
                class="botao"
                onclick="enviarIdeia()"
            >
                Enviar a minha ideia 💌
            </button>

        </div>

    </div>

</section>


<!-- CONTACTOS -->

<section class="contactos" id="contactos">

    <h2 class="titulo-seccao">
        Vamos criar algo especial?
    </h2>

    <p>
        Para dúvidas, encomendas ou ideias,
        entra em contacto connosco.
    </p>

    <div class="contactos-links">

        <a href="mailto:handandsoulartesanato@gmail.com">
            Email
        </a>

        <a
            href="https://www.instagram.com/hand_and_soul_artesanato/"
            target="_blank"
            rel="noopener noreferrer"
        >
            Instagram
        </a>

        <a
            href="https://www.tiktok.com/@hand_and_soul_artesanato"
            target="_blank"
            rel="noopener noreferrer"
        >
            TikTok
        </a>

    </div>

</section>

</main>


<!-- RODAPÉ -->

<footer>

    <p>Hand & Soul Artesanato</p>

    <p class="slogan">
        Made by hand. Made with soul.
    </p>

    <p>
        © 2026 Hand & Soul Artesanato
    </p>

</footer>


<!-- JAVASCRIPT -->

<script>

    function enviarIdeia() {

        const campo =
            document.getElementById("observacoes");

        const observacoes = campo.value.trim();

        if (observacoes === "") {
            alert("Conta-nos primeiro a tua ideia! 💭");
            return;
        }

        const email = "handandsoulartesanato@gmail.com";

        const assunto = encodeURIComponent(
            "Nova ideia de personalização ✨"
        );

        const mensagem = encodeURIComponent(
            "Olá, Hand & Soul! ❤️\n\n" +
            "Gostava de partilhar convosco a seguinte ideia:\n\n" +
            observacoes +
            "\n\nObrigada!"
        );

        window.location.href =
            "mailto:" + email +
            "?subject=" + assunto +
            "&body=" + mensagem;

    }

</script>

</body>
</html>
