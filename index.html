<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hand & Soul Artesanato</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Georgia, serif;
            background: #f4eee5;
            color: #3d3028;
            line-height: 1.6;
        }

        header {
            background: #3d3028;
            color: #f4eee5;
            padding: 25px 20px;
            text-align: center;
        }

        header h1 {
            font-size: 32px;
            letter-spacing: 2px;
        }

        header p {
            margin-top: 5px;
            font-size: 14px;
            letter-spacing: 1px;
        }

        nav {
            margin-top: 20px;
        }

        nav a {
            color: #f4eee5;
            text-decoration: none;
            margin: 0 10px;
            font-size: 15px;
        }

        nav a:hover {
            color: #d5b58c;
        }

        .hero {
            min-height: 500px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 60px 20px;
            background: #e7d7c5;
        }

        .hero-content {
            max-width: 700px;
        }

        .hero h2 {
            font-size: 48px;
            margin-bottom: 20px;
        }

        .hero .magic {
            font-size: 22px;
            font-style: italic;
            margin-bottom: 20px;
        }

        .hero p {
            font-size: 17px;
            margin-bottom: 30px;
        }

        .button {
            display: inline-block;
            background: #3d3028;
            color: #ffffff;
            padding: 13px 28px;
            border-radius: 30px;
            text-decoration: none;
            transition: 0.3s;
        }

        .button:hover {
            background: #705747;
        }

        section {
            padding: 70px 20px;
            text-align: center;
        }

        section h2 {
            font-size: 32px;
            margin-bottom: 15px;
        }

        .intro {
            max-width: 650px;
            margin: 0 auto 40px;
        }

        .categories {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            max-width: 1000px;
            margin: auto;
        }

        .category {
            background: #fffaf4;
            padding: 35px 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }

        .category span {
            font-size: 40px;
            display: block;
            margin-bottom: 15px;
        }

        .category h3 {
            margin-bottom: 8px;
        }

        .about {
            background: #ded0bd;
        }

        .about-content {
            max-width: 750px;
            margin: auto;
        }

        .custom {
            background: #f4eee5;
        }

        footer {
            background: #3d3028;
            color: #f4eee5;
            text-align: center;
            padding: 35px 20px;
        }

        footer p {
            margin: 5px 0;
        }

        @media (max-width: 700px) {

            header h1 {
                font-size: 26px;
            }

            nav a {
                display: inline-block;
                margin: 5px;
            }

            .hero h2 {
                font-size: 36px;
            }

            .categories {
                grid-template-columns: 1fr;
            }

        }

    </style>
</head>

<body>

    <header>

        <h1>Hand & Soul</h1>

        <p>Artesanato feito à mão, com alma</p>

        <nav>
            <a href="#inicio">Início</a>
            <a href="#pecas">Peças</a>
            <a href="#sobre">Sobre</a>
            <a href="#personalizados">Personalizados</a>
            <a href="#contactos">Contactos</a>
        </nav>

    </header>

    <main>

        <section class="hero" id="inicio">

            <div class="hero-content">

                <h2>Hand & Soul Artesanato</h2>

                <p class="magic">
                    ✨ Bem-vindo a este mundo mágico ✨
                </p>

                <p>
                    Peças únicas, criadas à mão e com dedicação,
                    para pessoas que procuram algo diferente,
                    especial e cheio de personalidade.
                </p>

                <a href="#pecas" class="button">
                    Explorar peças
                </a>

            </div>

        </section>

        <section id="pecas">
