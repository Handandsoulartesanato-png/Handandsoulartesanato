<!DOCTYPE html>
<html lang="pt-PT">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Hand & Soul Artesanato — peças feitas à mão, com alma, criatividade e carinho. Descobre as nossas criações e personaliza a tua peça.">

    <title>Hand & Soul Artesanato</title>

    <style>
        :root {
            --fundo: #f4eee5;
            --fundo-claro: #fffaf5;
            --castanho: #3d3028;
            --castanho-suave: #79685c;
            --bege: #e7d7c5;
            --rosa: #d8aaa3;
            --verde: #899985;
            --branco: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: var(--fundo);
            color: var(--castanho);
            font-family: Georgia, serif;
            line-height: 1.7;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        img {
            max-width: 100%;
            display: block;
        }

        /* CABEÇALHO */

        header {
            background: var(--fundo-claro);
            padding: 22px 6%;
            text-align: center;
            border-bottom: 1px solid var(--bege);
        }

        .logo {
            font-size: clamp(30px, 5vw, 46px);
            letter-spacing: 3px;
            font-weight: normal;
        }

        .slogan {
            color: var(--castanho-suave);
            font-size: 13px;
            letter-spacing: 2px;
            margin-top: 3px;
            font-style: italic;
        }

        nav {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 28px;
            margin-top: 22px;
        }

        nav a {
            font-size: 13px;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: color 0.2s;
        }

        nav a:hover {
            color: #a77b70;
        }

        /* SECÇÃO INICIAL */

        .inicio {
            min-height: 540px;
            padding: 100px 8%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background:
                linear-gradient(
                    rgba(244, 238, 229, 0.35),
                    rgba(244, 238, 229, 0.85)
                );
        }

        .inicio-conteudo {
            max-width: 760px;
        }

        .inicio h1 {
            font-size: clamp(38px, 7vw, 66px);
            font-weight: normal;
            line-height: 1.2;
            margin-bottom: 22px;
        }

        .inicio p {
            color: var(--castanho-suave);
            font-size: 17px;
            max-width: 600px;
            margin: 0 auto 30px;
        }

        .botao {
            display: inline-block;
            padding: 13px 28px;
            background: var(--castanho);
            color: var(--branco);
            border: 1px solid var(--castanho);
            font-family: Georgia, serif;
            font-size: 12px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.25s;
        }

        .botao:hover {
            background: transparent;
            color: var(--castanho);
        }

        /* SECÇÕES GERAIS */

        section {
            padding: 85px 7%;
            scroll-margin-top: 25px;
        }

        .titulo-seccao {
            text-align: center;
            font-size: clamp(29px, 4vw, 39px);
            font-weight: normal;
            margin-bottom: 15px;
        }

        .section-intro {
            max-width: 650px;
            margin: 0 auto 45px;
            text-align: center;
            color: var(--castanho-suave);
            font-size: 16px;
        }

        /* CATEGORIAS */

        .categorias {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 22px;
            max-width: 1100px;
            margin: 0 auto;
        }

        .categoria {
            background: var(--fundo-claro);
            padding: 30px 20px;
            text-align: center;
            border: 1px solid var(--bege);
            transition: transform 0.25s;
        }

        .categoria:hover {
            transform: translateY(-4px);
        }

        .categoria span {
            display: block;
            font-size: 30px;
            margin-bottom: 10px;
        }

        .categoria strong {
            display: block;
            font-size: 18px;
            font-weight: normal;
            margin-bottom: 8px;
        }

        .categoria p {
            color: var(--castanho-suave);
            font-size: 14px;
        }

        /* GALERIA */

        .galeria {
            background: var(--fundo-claro);
        }

        .galeria-pecas {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 20px;
            max-width: 1150px;
            margin: 0 auto;
        }

        .galeria-pecas img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: contain;
            background: var(--fundo);
            padding: 8px;
            border: 1px solid var(--bege);
            transition: transform 0.25s;
        }

        .galeria-pecas img:hover {
            transform: scale(1.025);
        }

        /* SOBRE NÓS */

        .sobre {
            background: var(--bege);
            text-align: center;
        }

        .sobre-conteudo {
            max-width: 750px;
            margin: 0 auto;
        }

            color: var(--castanho-suave
